name: CodeRabbit AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  coderabbit-review:
    name: CodeRabbit Review Trigger
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Request CodeRabbit Review on PR
        uses: actions/github-script@v9
        with:
          script: |
            if (!context.payload.pull_request) {
              core.info('No pull request found in event payload.');
              return;
            }

            const prNumber = context.payload.pull_request.number;
            const { owner, repo } = context.repo;

            // Fetch comments on the pull request
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });

            // Check if CodeRabbit review was already requested
            const alreadyRequested = comments.some(
              (c) => c.body && c.body.includes('@coderabbitai review')
            );

            if (alreadyRequested) {
              core.info(`CodeRabbit review was already triggered on PR #${prNumber}.`);
              return;
            }

            // Trigger CodeRabbit review by leaving comment
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: '@coderabbitai review',
            });

            core.info(`Successfully requested CodeRabbit review on PR #${prNumber}.`);
