name: Version Bump & Changelog

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Select version bump type (patch, minor, or major)"
        required: true
        type: choice
        default: "patch"
        options:
          - patch
          - minor
          - major
      create_tag:
        description: "Create and push git tag to trigger release workflow"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  bump:
    name: Bump Version & Update Changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run bump-version script
        run: |
          chmod +x ./scripts/bump-version.sh
          ./scripts/bump-version.sh ${{ inputs.bump_type }}

      - name: Commit and Push Version Bump
        id: commit_version
        run: |
          NEW_VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          git add Cargo.toml frontend/package.json frontend/package-lock.json CHANGELOG.md
          git commit -m "chore(release): bump version to v${NEW_VERSION}

          Co-Authored-By: Claude Code <noreply@anthropic.com>"
          git push origin HEAD

          if [ "${{ inputs.create_tag }}" = "true" ]; then
            git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
            git push origin "v${NEW_VERSION}"
            echo "pushed_tag=v${NEW_VERSION}" >> $GITHUB_OUTPUT
          fi
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "### Version Bump Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Bump Type**: ${{ inputs.bump_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **New Version**: v${{ steps.commit_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag Created**: ${{ steps.commit_version.outputs.pushed_tag || 'none' }}" >> $GITHUB_STEP_SUMMARY
