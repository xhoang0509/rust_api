services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - DATABASE_URL=sqlite:///data/rust_api.db?mode=rwc
      - JWT_SECRET=change-this-in-production-secret-key-32chars
    volumes:
      - app_data:/data
    restart: unless-stopped

volumes:
  app_data:
